<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYSC FAQ Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 850px;
            height: 90vh;
            margin: 30px auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 22px;
            text-align: center;
            background: #222;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user .bubble {
            background: #222;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .bot .bubble {
            background: #f0f2f4;
            color: #222;
            border-bottom-left-radius: 3px;
        }

        .category {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .score {
            margin-top: 8px;
            font-size: 12px;
            color: #777;
        }

        .suggestions {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }

        .suggestion {
            margin-top: 8px;
        }

        .suggestion button {
            width: 100%;
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .suggestion button:hover {
            background: #eee;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #question {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        #askButton {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .portal {
            text-align: center;
            padding: 12px;
            font-size: 13px;
        }

        .portal a {
            color: #222;
            font-weight: bold;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>NYSC FAQ Chatbot</h1>

        <p>
            Ask questions about NYSC registration, camp,
            relocation and more.
        </p>
    </div>

    <div id="chat">

        <div class="message bot">
            <div class="bubble">

                Hello! 👋

                <br><br>

                I'm the NYSC FAQ Chatbot.

                Ask me a question about registration,
                camp, relocation, exemption or other
                NYSC-related topics.

            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask your NYSC question..."
            autocomplete="off"
        >

        <button id="askButton">
            Ask
        </button>

    </div>

    <div class="portal">

        <a
            href="https://portal.nysc.org.ng/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Visit the official NYSC portal
        </a>

    </div>

</div>


<script>

    const chat =
        document.getElementById("chat");

    const questionInput =
        document.getElementById("question");

    const askButton =
        document.getElementById("askButton");


    /*
     * Persistent conversation memory
     */

    let previousQuestion =
        localStorage.getItem(
            "nysc_previous_question"
        ) || "";


    let previousAnswer =
        localStorage.getItem(
            "nysc_previous_answer"
        ) || "";


    let conversationHistory = [];


    try {

        conversationHistory =
            JSON.parse(
                localStorage.getItem(
                    "nysc_conversation_history"
                ) || "[]"
            );

        if (!Array.isArray(conversationHistory)) {

            conversationHistory = [];

        }

    } catch (error) {

        conversationHistory = [];

    }


    console.log(
        "Previous question:",
        previousQuestion
    );

    console.log(
        "Previous answer:",
        previousAnswer
    );

    console.log(
        "Conversation history:",
        conversationHistory
    );


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    function addMessage(text, type) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        bubble.innerHTML = text;


        message.appendChild(bubble);

        chat.appendChild(message);


        chat.scrollTop =
            chat.scrollHeight;
    }


    function removeTypingMessage() {

        const messages =
            document.querySelectorAll(
                ".message"
            );


        const lastMessage =
            messages[messages.length - 1];


        if (
            lastMessage &&
            lastMessage.querySelector(
                ".typing"
            )
        ) {

            lastMessage.remove();

        }
    }


    async function askQuestion() {

        console.log(
            "ASK BUTTON FUNCTION IS RUNNING"
        );


        const question =
            questionInput.value.trim();


        if (!question) {

            return;

        }


        addMessage(
            escapeHtml(question),
            "user"
        );


        questionInput.value = "";

        askButton.disabled = true;


        addMessage(
            '<span class="typing">Chatbot is thinking...</span>',
            "bot"
        );


        try {

            const response =
                await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question: question,

                        previous_question:
                            previousQuestion,

                        previous_answer:
                            previousAnswer,

                        conversation_history:
                            conversationHistory

                    })

                });


            const data =
                await response.json();


            removeTypingMessage();


            if (!response.ok) {

                addMessage(
                    '<span class="error">' +
                    escapeHtml(
                        data.error ||
                        "Something went wrong."
                    ) +
                    "</span>",
                    "bot"
                );

                return;

            }


            let answer = "";


            if (data.category) {

                answer +=
                    '<div class="category">' +
                    "Category: " +
                    escapeHtml(
                        data.category
                    ) +
                    "</div>";

            }


            answer +=
                "<div>" +
                escapeHtml(
                    data.answer || ""
                ) +
                "</div>";


            if (
                data.score !== undefined &&
                data.score !== null
            ) {

                answer +=
                    '<div class="score">' +
                    "Similarity Score: " +
                    data.score +
                    "</div>";

            }


            if (
                data.matches &&
                data.matches.length > 0
            ) {

                answer +=
                    '<div class="suggestions">' +
                    "<strong>Top Matches</strong>";


                data.matches.forEach(
                    function(match) {

                        answer +=
                            '<div class="suggestion">' +

                            '<button type="button" ' +
                            'onclick="useSuggestion(this)">' +

                            escapeHtml(
                                match.question
                            ) +

                            "</button>" +

                            '<div class="score">' +

                            "Similarity: " +

                            match.score +

                            "</div>" +

                            "</div>";

                    }
                );


                answer +=
                    "</div>";

            }


            addMessage(
                answer,
                "bot"
            );


            /*
             * Update memory
             */

            previousQuestion =
                question;


            previousAnswer =
                data.answer || "";


            conversationHistory.push({

                question:
                    question,

                answer:
                    data.answer || "",

                category:
                    data.category || null

            });


            if (
                conversationHistory.length > 5
            ) {

                conversationHistory =
                    conversationHistory.slice(-5);

            }


            /*
             * Save memory
             */

            localStorage.setItem(
                "nysc_previous_question",
                previousQuestion
            );


            localStorage.setItem(
                "nysc_previous_answer",
                previousAnswer
            );


            localStorage.setItem(
                "nysc_conversation_history",
                JSON.stringify(
                    conversationHistory
                )
            );


        } catch (error) {

            removeTypingMessage();


            addMessage(
                '<span class="error">' +
                "Unable to connect to the chatbot server." +
                "</span>",
                "bot"
            );


            console.error(
                "Chatbot error:",
                error
            );

        }


        askButton.disabled = false;

        questionInput.focus();

    }


    function useSuggestion(button) {

        questionInput.value =
            button.innerText;

        askQuestion();

    }


    askButton.addEventListener(
        "click",
        askQuestion
    );


    questionInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                askQuestion();

            }

        }
    );

</script>

</body>

</html>
