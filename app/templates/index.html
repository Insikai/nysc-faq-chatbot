<body>

    <div class="container">

        <div class="header">
            <h1>NYSC FAQ Chatbot</h1>
            <p>Ask questions about NYSC registration, camp, relocation and more.</p>
        </div>

        <div id="chat">

            <div class="message bot">
                <div class="bubble">
                    Hello! 👋
                    <br><br>
                    I'm the NYSC FAQ Chatbot. Ask me a question about
                    registration, camp, relocation, exemption or other
                    NYSC-related topics.
                </div>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask your NYSC question..."
                autocomplete="off"
            >

            <button id="askButton">
                Ask
            </button>

        </div>

        <div class="portal">
            <a
                href="https://portal.nysc.org.ng/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Visit the official NYSC portal
            </a>
        </div>

    </div>


    <script>

        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const askButton = document.getElementById("askButton");

        // Lesson 25:
        // Store the previous question so the chatbot can
        // understand possible follow-up questions.
        window.lastQuestion = "";


        function addMessage(text, type) {

            const message = document.createElement("div");

            message.className = "message " + type;

            const bubble = document.createElement("div");

            bubble.className = "bubble";

            bubble.innerHTML = text;

            message.appendChild(bubble);

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;
        }


        async function askQuestion() {

            const question = questionInput.value.trim();

            if (!question) {
                return;
            }


            addMessage(
                question.replace(/</g, "&lt;").replace(/>/g, "&gt;"),
                "user"
            );


            questionInput.value = "";

            // Save the current question for the next message.
            const previousQuestion = window.lastQuestion;

            window.lastQuestion = question;


            askButton.disabled = true;


            addMessage(
                '<span class="typing">Chatbot is thinking...</span>',
                "bot"
            );


            try {

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question,
                        previous_question: previousQuestion
                    })

                });


                const data = await response.json();


                const messages = document.querySelectorAll(".message");

                const lastMessage = messages[messages.length - 1];


                if (
                    lastMessage &&
                    lastMessage.querySelector(".typing")
                ) {
                    lastMessage.remove();
                }


                if (!response.ok) {

                    addMessage(
                        data.error || "Something went wrong.",
                        "bot"
                    );

                    return;
                }


                let answer = "";


                if (data.category) {

                    answer += `
                        <div class="category">
                            Category: ${data.category}
                        </div>
                    `;
                }


                answer += `
                    <div>
                        ${data.answer}
                    </div>
                `;


                answer += `
                    <div class="score">
                        Similarity Score: ${data.score}
                    </div>
                `;


                if (data.matches && data.matches.length > 0) {

                    answer += `
                        <div class="suggestions">
                            <strong>Top Matches</strong>
                    `;


                    data.matches.forEach(function(match) {

                        answer += `
                            <div class="suggestion">

                                <button
                                    onclick="useSuggestion(this)"
                                >
                                    ${match.question}
                                </button>

                                <div class="score">
                                    Similarity: ${match.score}
                                </div>

                            </div>
                        `;

                    });


                    answer += `
                        </div>
                    `;
                }


                addMessage(answer, "bot");


            } catch (error) {

                const messages = document.querySelectorAll(".message");

                const lastMessage = messages[messages.length - 1];


                if (
                    lastMessage &&
                    lastMessage.querySelector(".typing")
                ) {
                    lastMessage.remove();
                }


                addMessage(
                    "Unable to connect to the chatbot server.",
                    "bot"
                );


                console.error(error);

            }


            askButton.disabled = false;

            questionInput.focus();

        }


        function useSuggestion(button) {

            questionInput.value = button.innerText;

            askQuestion();

        }


        askButton.addEventListener(
            "click",
            askQuestion
        );


        questionInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    askQuestion();
                }

            }
        );

    </script>

</body>

</html>
